# Fork sources and ForkAssets.xcassets are included by the upstream Tinycast source directory.
# Per-configuration settings outrank the upstream target's base icon setting after include merging.
targets:
  Tinycast:
    settings:
      base:
        # libghostty-vt prototype: built by Scripts/fork-build-libghostty.sh into .tools/libghostty (gitignored).
        # The XCFramework's own module map exposes `import GhosttyVt`; the static archive is linked directly.
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.tools/libghostty/ghostty-vt.xcframework/macos-arm64_x86_64/Headers"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/.tools/libghostty/ghostty-vt.xcframework/macos-arm64_x86_64/Headers"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.tools/libghostty/ghostty-vt.xcframework/macos-arm64_x86_64"
        OTHER_LDFLAGS: "$(inherited) -lghostty-vt"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: ForkAppIcon
          # Fork: Debug signs "Sign to Run Locally" so Xcode builds without the Tinycast Self-Signed identity.
          CODE_SIGN_IDENTITY: "-"
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: ForkAppIcon
  ClipboardTextHelper:
    settings:
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
  DictationHelper:
    settings:
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
  # Preview host: only the AgentRuns and terminal card UI and the design-system files they read, so
  # Xcode's canvas (whose JIT linker cannot take libghostty-vt) has a target to preview in. No AppCore.
  TinycastPreviews:
    type: application
    platform: macOS
    sources:
      - path: PreviewsApp
      - path: Tinycast
        includes:
          - Features/AgentRuns/Model
          - Features/AgentRuns/UI
          - Features/TerminalInstances/UI/TerminalInstanceCard.swift
          - Features/TerminalInstances/UI/TerminalInstanceMetrics.swift
          - Features/TerminalInstances/UI/TerminalInstancesPreviewData.swift
          - Features/TerminalInstances/Model/TerminalSessionPhase.swift
          - Features/TerminalInstances/Model/TerminalMarkParser.swift
          - Features/TerminalInstances/Model/TerminalInstanceStack.swift
          - Features/AgentRuns/Service/AgentRunsMonitor.swift
          - Features/AgentRuns/Service/AgentRunLauncher.swift
          - DesignSystem/InterfaceMetrics.swift
          - DesignSystem/Theme.swift
          - DesignSystem/GlassEffectView.swift
          - Features/CustomCommands/Service/ShellCommandRunner.swift
          - Fork/ForkColors.swift
          - Fork/ForkTypography.swift
          - Platform/Appearance.swift
          - Features/CustomCommands/UI/CommandDuration.swift
          - Platform/ProcessExit.swift
          - Platform/PseudoTerminal.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinycast.previews
        PRODUCT_NAME: TinycastPreviews
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
