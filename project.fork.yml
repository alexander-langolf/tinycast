# Fork sources and ForkAssets.xcassets are included by the upstream Tinycast source directory.
# Per-configuration settings outrank the upstream target's base icon setting after include merging.
targets:
  Tinycast:
    dependencies:
      # Automation bridge: `Tinycast.app/Contents/Helpers/tinycast mcp --stdio`.
      - target: TinycastCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        # libghostty-vt prototype: built by Scripts/fork-build-libghostty.sh into .tools/libghostty (gitignored).
        # The XCFramework's own module map exposes `import GhosttyVt`; the static archive is linked directly.
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.tools/libghostty/ghostty-vt.xcframework/macos-arm64_x86_64/Headers"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/.tools/libghostty/ghostty-vt.xcframework/macos-arm64_x86_64/Headers"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.tools/libghostty/ghostty-vt.xcframework/macos-arm64_x86_64"
        OTHER_LDFLAGS: "$(inherited) -lghostty-vt"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: ForkAppIcon
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: ForkAppIcon

  TinycastCLI:
    type: tool
    platform: macOS
    sources:
      - TinycastCLI
    settings:
      base:
        EXECUTABLE_NAME: tinycast
        PRODUCT_MODULE_NAME: TinycastCLI
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
